[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicumene-boid"
version = "0.3.0"
description = "Bernadotte Oscillator Intrinsic Dimension (BOID): oscillator-dimensionality estimation for structured multichannel time series"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Alexandra Bernadotte"},
  {name = "Ivan Menshikov"}
]
license = {text = "PolyForm-Noncommercial-1.0.0"}
keywords = [
  "time-series",
  "oscillators",
  "intrinsic-dimension",
  "Hankel",
  "MSSA",
  "ESPRIT",
  "signal-processing"
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "aicumene-mssa @ git+https://github.com/aicumene/MSSA.git"
]

[project.optional-dependencies]
analysis = ["pandas>=2.1", "scikit-learn>=1.3"]
neuroscience = ["pandas>=2.1", "mne>=1.6"]
topology = ["ripser>=0.6.8"]
dev = ["pytest>=8.0", "PyYAML>=6.0"]
all = [
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "mne>=1.6",
  "ripser>=0.6.8",
  "PyYAML>=6.0"
]

[project.urls]
Homepage = "https://github.com/aicumene/BOID"
Preprint = "https://research.aicumene.com/papers/boid-coma/"
"Theoretical foundation" = "https://doi.org/10.64898/2026.04.25.720787"
MSSA = "https://github.com/aicumene/MSSA"
Dataset = "https://doi.org/10.5281/zenodo.22923070"

[project.scripts]
boid-synthetic = "boid.cli:synthetic_main"
boid-sleep = "boid.cli:sleep_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
